name: 🤖 Daily News Agent

on:
  schedule:
    # Runs at 3:30 AM UTC = 9:00 AM IST
    # Adjust for your timezone: https://crontab.guru
    - cron: '30 3 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code (us, in, gb, etc.)'
        required: false
        default: 'us'
      category:
        description: 'Category (business, technology, health, etc.)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'

jobs:
  send-news-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🔎 Validate required secrets
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          MY_WHATSAPP_NUMBER: ${{ secrets.MY_WHATSAPP_NUMBER }}
        run: |
          missing=0
          for key in NEWS_API_KEY GROQ_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_WHATSAPP_FROM MY_WHATSAPP_NUMBER; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: 🚀 Run News Agent
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          MY_WHATSAPP_NUMBER: ${{ secrets.MY_WHATSAPP_NUMBER }}
        run: |
          COUNTRY="${{ github.event.inputs.country || '' }}"
          CATEGORY="${{ github.event.inputs.category || '' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          ARGS="--once"
          if [ "$COUNTRY" != "" ]; then
            ARGS="$ARGS --country $COUNTRY"
          fi
          if [ "$CATEGORY" != "" ]; then
            ARGS="$ARGS --category $CATEGORY"
          fi
          if [ "$DRY_RUN" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS